<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>邪恶坏笑 Base‑4 加密器</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#171a21;
      --panel2:#1e222b;
      --text:#f3f5f7;
      --muted:#9aa4b2;
      --border:#2b313c;
      --accent:#e8e8e8;
      --danger:#ff8e8e;
      --ok:#9ee6b0;
      --shadow:0 18px 60px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.05), transparent 26rem),
        var(--bg);
      color:var(--text);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    }
    .wrap{
      width:min(1120px, calc(100% - 32px));
      margin:0 auto;
      padding:52px 0 70px;
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:24px;
      margin-bottom:22px;
    }
    h1{
      margin:0;
      font-size:clamp(28px,4vw,46px);
      letter-spacing:-.04em;
    }
    .sub{
      margin:10px 0 0;
      color:var(--muted);
      line-height:1.7;
      max-width:760px;
    }
    .badge{
      white-space:nowrap;
      padding:8px 11px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      background:rgba(255,255,255,.025);
      font-size:13px;
    }
    .card{
      background:rgba(23,26,33,.92);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      padding:14px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.018);
    }
    button{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:10px 14px;
      border-radius:11px;
      cursor:pointer;
      font-weight:700;
      transition:.16s ease;
    }
    button:hover{transform:translateY(-1px);border-color:#505968}
    button.primary{
      background:var(--accent);
      color:#111;
      border-color:transparent;
    }
    button.ghost{background:transparent}
    .grow{flex:1}
    .noise-control{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:235px;
      color:var(--muted);
      font-size:13px;
    }
    input[type="range"]{width:120px}
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
    }
    .pane{padding:16px}
    .pane + .pane{border-left:1px solid var(--border)}
    .pane-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .pane-title{font-weight:800}
    .count{font-size:12px;color:var(--muted)}
    textarea{
      width:100%;
      min-height:360px;
      resize:vertical;
      border:1px solid var(--border);
      border-radius:14px;
      background:#11141a;
      color:var(--text);
      padding:15px;
      outline:none;
      line-height:1.7;
      font:15px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas,
        "Liberation Mono","Microsoft YaHei",monospace;
    }
    textarea:focus{border-color:#596273}
    .status{
      min-height:24px;
      padding:12px 16px 16px;
      color:var(--muted);
      font-size:13px;
      border-top:1px solid var(--border);
    }
    .status.ok{color:var(--ok)}
    .status.err{color:var(--danger)}
    .info{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:16px;
    }
    .info-box{
      border:1px solid var(--border);
      border-radius:16px;
      padding:15px;
      background:rgba(255,255,255,.018);
    }
    .info-box h3{margin:0 0 8px;font-size:14px}
    .info-box p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
    code{color:#fff}
    @media(max-width:760px){
      header{align-items:flex-start;flex-direction:column}
      .grid{grid-template-columns:1fr}
      .pane + .pane{border-left:0;border-top:1px solid var(--border)}
      .info{grid-template-columns:1fr}
      .noise-control{width:100%}
      .noise-control input{flex:1}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>邪恶坏笑 Base‑4 加密器 🤓</h1>
        <p class="sub">
          用「木、钼、嘿、𬭶」表示四进制数字；原文先编码成 UTF‑8，
          所以中文、英文、Emoji、换行和标点都能无损恢复。
        </p>
      </div>
    </header>

    <section class="card">
      <div class="toolbar">
        <button id="encryptBtn" class="primary">加密 →</button>
        <button id="decryptBtn">← 解密</button>
        <button id="swapBtn" class="ghost">交换两栏</button>
        <button id="clearBtn" class="ghost">清空</button>
        <div class="grow"></div>
        <label class="noise-control">
          坏笑语法强度
          <input id="noiseRange" type="range" min="0" max="45" value="14" />
          <span id="noiseValue">14%</span>
        </label>
      </div>

      <div class="grid">
        <div class="pane">
          <div class="pane-head">
            <span class="pane-title">左侧</span>
            <span id="leftCount" class="count">0 字符</span>
          </div>
          <textarea id="left" placeholder="输入要加密的原文，例如：今晚行动！🤓"></textarea>
        </div>
        <div class="pane">
          <div class="pane-head">
            <span class="pane-title">右侧</span>
            <div>
              <span id="rightCount" class="count">0 字符</span>
              <button id="copyBtn" style="margin-left:8px;padding:6px 9px;font-size:12px">复制</button>
            </div>
          </div>
          <textarea id="right" placeholder="例如：木嘿嘿嘿钼木𬭶木~嘿嘿🤓……"></textarea>
        </div>
      </div>

      <div id="status" class="status">
        映射：00→木，01→钼，10→嘿，11→𬭶。语法层把“木、钼”都视为木音：倾向开句、不裸着收尾、连续木音必须拆开，并尽量保护“嘿嘿嘿”；🤓 ~ ！ 不参与解密。
      </div>
    </section>
</main>

<script>
(() => {
  // 四进制字典：
  // 0 = 00 = 木
  // 1 = 01 = 钼
  // 2 = 10 = 嘿
  // 3 = 11 = 𬭶
  const ALPHABET = ["木", "钼", "嘿", "𬭶"];
  const REVERSE = new Map(ALPHABET.map((ch, i) => [ch, i]));
  const NOISE = ["🤓", "~", "！"];
  const MU_SOUNDS = new Set(["木", "钼"]);

  const left = document.getElementById("left");
  const right = document.getElementById("right");
  const status = document.getElementById("status");
  const noiseRange = document.getElementById("noiseRange");
  const noiseValue = document.getElementById("noiseValue");
  const leftCount = document.getElementById("leftCount");
  const rightCount = document.getElementById("rightCount");

  function setStatus(message, type = "") {
    status.textContent = message;
    status.className = "status" + (type ? " " + type : "");
  }

  function countCodePoints(str) {
    return [...str].length;
  }

  function updateCounts() {
    leftCount.textContent = `${countCodePoints(left.value)} 字符`;
    rightCount.textContent = `${countCodePoints(right.value)} 字符`;
  }

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function phraseSeparator(strengthPercent, soft = false) {
    const strength = strengthPercent / 100;

    // 句中更偏向 ~，句尾更偏向 ！/🤓。
    const softPool = ["~", "~", "~", "！", "🤓"];
    const hardPool = ["！", "~", "🤓", "！！", "~🤓", "！🤓"];

    let out = randomFrom(soft ? softPool : hardPool);

    // 强度越高，越可能追加第二个语气符号。
    if (Math.random() < strength * 0.35) {
      out += randomFrom(["~", "！", "🤓"]);
    }
    return out;
  }

  function decorate(core, strengthPercent) {
    if (!core) return core;

    const chars = [...core];
    const strength = Math.max(0, Math.min(100, strengthPercent)) / 100;
    const phrases = [];
    let current = "";

    function flushCurrent() {
      if (current) {
        phrases.push(current);
        current = "";
      }
    }

    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const prev = chars[i - 1] ?? "";
      const next = chars[i + 1] ?? "";
      const isMu = MU_SOUNDS.has(ch);
      const nextIsMu = MU_SOUNDS.has(next);

      // 核心规则：
      // “木音”包括 木、钼。它们都倾向于作为一个坏笑小句的开头。
      // 如果当前句已经有内容，再遇到木音，就先结束上一句。
      if (isMu && current.length > 0) {
        flushCurrent();
      }

      current += ch;

      // 连续“嘿嘿 / 嘿嘿嘿”尽量不断句。
      if (ch === "嘿" && next === "嘿") {
        continue;
      }

      // 如果当前句只有一个木音，而下一个仍是木音，
      // 当前木音单独成句，避免 木木 / 木钼 / 钼木 / 钼钼 连在一起。
      if (isMu && [...current].length === 1 && nextIsMu) {
        flushCurrent();
        continue;
      }

      // 对非木音开头的小句，允许自然延伸；
      // 强度较高时，在较长句中适当切分，但避免拆开“嘿嘿嘿”。
      const cpLen = [...current].length;
      const protectedHeiRun =
        (prev === "嘿" && ch === "嘿") ||
        (ch === "嘿" && next === "嘿");

      if (
        cpLen >= 5 &&
        !protectedHeiRun &&
        next &&
        !nextIsMu &&
        Math.random() < strength * 0.18
      ) {
        flushCurrent();
      }
    }

    flushCurrent();

    // 拼接坏笑小句。
    // 分隔符全部属于展示层，解密时会直接丢弃。
    let result = "";

    for (let i = 0; i < phrases.length; i++) {
      const phrase = phrases[i];
      result += phrase;

      const isLast = i === phrases.length - 1;
      const phraseChars = [...phrase];
      const isSingleMu =
        phraseChars.length === 1 && MU_SOUNDS.has(phraseChars[0]);
      const endsWithMu =
        phraseChars.length > 0 && MU_SOUNDS.has(phraseChars[phraseChars.length - 1]);

      if (!isLast) {
        // 句间必须有分隔，使下一个木音视觉上成为新句开头。
        if (isSingleMu) {
          result += randomFrom(["！", "~", "🤓", "！🤓", "~🤓"]);
        } else {
          result += phraseSeparator(strengthPercent, true);
        }
        continue;
      }

      // 木音一般不裸着做最终结尾。
      // 单独一个 木/钼 可以成句，但必须带语气符号。
      if (endsWithMu) {
        result += isSingleMu
          ? randomFrom(["！", "~", "🤓", "！🤓", "~🤓"])
          : randomFrom(["~", "！", "🤓"]);
      } else {
        // 嘿可以自然收尾，所以允许不加任何符号。
        const baseChance = 0.38 + strength * 0.5;
        if (Math.random() < baseChance) {
          result += phraseSeparator(strengthPercent, false);
        }
      }
    }

    return result;
  }

  function encryptText(text, densityPercent) {
    const bytes = new TextEncoder().encode(text);
    let core = "";

    for (const byte of bytes) {
      // 一个字节 8 bit，每 2 bit 是一个 base‑4 digit，所以固定输出 4 个字。
      core += ALPHABET[(byte >> 6) & 0b11];
      core += ALPHABET[(byte >> 4) & 0b11];
      core += ALPHABET[(byte >> 2) & 0b11];
      core += ALPHABET[byte & 0b11];
    }

    return decorate(core, densityPercent);
  }

  function normalizeCipher(cipher) {
    // 🤓、~、全角/半角感叹号以及空白都视为展示噪声。
    return cipher.replace(/🤓|~|！|!|\s/gu, "");
  }

  function decryptText(cipher) {
    const clean = normalizeCipher(cipher);
    const chars = [...clean];

    if (chars.length === 0) return "";

    if (chars.length % 4 !== 0) {
      throw new Error(`有效密文长度为 ${chars.length}，不是 4 的倍数，可能有字符缺失或混入了非法字符。`);
    }

    const bytes = new Uint8Array(chars.length / 4);

    for (let i = 0; i < chars.length; i += 4) {
      let byte = 0;

      for (let j = 0; j < 4; j++) {
        const digit = REVERSE.get(chars[i + j]);
        if (digit === undefined) {
          throw new Error(`发现非法密文字符「${chars[i + j]}」。密文只能包含 木、钼、嘿、𬭶，以及允许的噪声符号。`);
        }
        byte = (byte << 2) | digit;
      }

      bytes[i / 4] = byte;
    }

    // fatal:true 可以发现密文损坏，而不是静默输出替换字符 �。
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }

  document.getElementById("encryptBtn").addEventListener("click", () => {
    try {
      right.value = encryptText(left.value, Number(noiseRange.value));
      updateCounts();
      setStatus("加密完成。语法美化器会把“木、钼”统一按木音处理：尽量作为小句开头、避免裸着收尾、连续木音强制拆开，并保护“嘿嘿嘿”。", "ok");
    } catch (err) {
      setStatus("加密失败：" + err.message, "err");
    }
  });

  document.getElementById("decryptBtn").addEventListener("click", () => {
    try {
      left.value = decryptText(right.value);
      updateCounts();
      setStatus("解密完成。🤓、~、！、! 和空白已作为噪声忽略。", "ok");
    } catch (err) {
      setStatus("解密失败：" + err.message, "err");
    }
  });

  document.getElementById("swapBtn").addEventListener("click", () => {
    [left.value, right.value] = [right.value, left.value];
    updateCounts();
    setStatus("已交换两栏。");
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    left.value = "";
    right.value = "";
    updateCounts();
    setStatus("已清空。");
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(right.value);
      setStatus("右侧内容已复制。", "ok");
    } catch {
      right.select();
      document.execCommand("copy");
      setStatus("右侧内容已复制。", "ok");
    }
  });

  noiseRange.addEventListener("input", () => {
    noiseValue.textContent = noiseRange.value + "%";
  });

  left.addEventListener("input", updateCounts);
  right.addEventListener("input", updateCounts);
  updateCounts();
})();
</script>
</body>
</html>
