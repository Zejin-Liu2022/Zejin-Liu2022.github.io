<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>邪恶坏笑编码器 V2</title>
  <style>
    :root{
      --bg:#0f1115;
      --panel:#171a21;
      --panel2:#1e222b;
      --text:#f3f5f7;
      --muted:#9aa4b2;
      --border:#2b313c;
      --accent:#e8e8e8;
      --danger:#ff8e8e;
      --ok:#9ee6b0;
      --shadow:0 18px 60px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 20% 0%,rgba(255,255,255,.05),transparent 26rem),
        var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
        "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    }
    .wrap{
      width:min(1120px,calc(100% - 32px));
      margin:0 auto;
      padding:52px 0 70px;
    }
    header{margin-bottom:22px}
    h1{
      margin:0;
      font-size:clamp(28px,4vw,46px);
      letter-spacing:-.04em;
    }
    .sub{
      margin:10px 0 0;
      color:var(--muted);
      line-height:1.7;
      max-width:850px;
    }
    .card{
      background:rgba(23,26,33,.92);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      padding:14px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.018);
    }
    button{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:10px 14px;
      border-radius:11px;
      cursor:pointer;
      font-weight:700;
      transition:.16s ease;
    }
    button:hover{transform:translateY(-1px);border-color:#505968}
    button.primary{
      background:var(--accent);
      color:#111;
      border-color:transparent;
    }
    button.ghost{background:transparent}
    .grid{display:grid;grid-template-columns:1fr 1fr}
    .pane{padding:16px}
    .pane + .pane{border-left:1px solid var(--border)}
    .pane-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .pane-title{font-weight:800}
    .count{font-size:12px;color:var(--muted)}
    textarea{
      width:100%;
      min-height:390px;
      resize:vertical;
      border:1px solid var(--border);
      border-radius:14px;
      background:#11141a;
      color:var(--text);
      padding:15px;
      outline:none;
      line-height:1.7;
      font:15px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,
        "Liberation Mono","Microsoft YaHei",monospace;
    }
    textarea:focus{border-color:#596273}
    .status{
      min-height:24px;
      padding:12px 16px 16px;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
      border-top:1px solid var(--border);
    }
    .status.ok{color:var(--ok)}
    .status.err{color:var(--danger)}
    .stats{
      display:flex;
      flex-wrap:wrap;
      gap:8px 16px;
      padding:12px 16px;
      color:var(--muted);
      font-size:12px;
      border-top:1px solid var(--border);
      background:rgba(255,255,255,.012);
    }
    .stats strong{color:var(--text)}
    @media(max-width:760px){
      .grid{grid-template-columns:1fr}
      .pane + .pane{border-left:0;border-top:1px solid var(--border)}
    }
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>邪恶坏笑编码器 V2 🤓</h1>
  </header>

  <section class="card">
    <div class="toolbar">
      <button id="encryptBtn" class="primary">加密 →</button>
      <button id="decryptBtn">← 解密</button>
      <button id="swapBtn" class="ghost">交换两栏</button>
      <button id="clearBtn" class="ghost">清空</button>
      <button id="copyBtn" class="ghost">复制右侧</button>
    </div>

    <div class="grid">
      <div class="pane">
        <div class="pane-head">
          <span class="pane-title">原文</span>
          <span id="leftCount" class="count">0 字符</span>
        </div>
        <textarea id="left" placeholder="输入要加密的内容"></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <span class="pane-title">坏笑密文</span>
          <span id="rightCount" class="count">0 字符</span>
        </div>
        <textarea id="right" placeholder="输入或生成 V2 坏笑密文"></textarea>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  const HEADS = ["木", "钼", "嘿", "𬭶"];
  const AFTER_HEAD = ["嘿", "𬭶", "~", "！", "🤓"];
  const AFTER_BOUNDARY = ["木", "钼", "嘿", "𬭶", "~", "！", "🤓"];
  const PUNCT = new Set(["~", "！", "🤓"]);
  const VALID = new Set(AFTER_BOUNDARY);

  // 协议头："EL" + version 2 + flags + CRC16
  const MAGIC_0 = 0x45;
  const MAGIC_1 = 0x4C;
  const VERSION = 0x02;
  const FLAG_GZIP = 0x01;

  const left = document.getElementById("left");
  const right = document.getElementById("right");
  const leftCount = document.getElementById("leftCount");
  const rightCount = document.getElementById("rightCount");

  function cpLength(s) {
    return [...s].length;
  }

  function updateCounts() {
    leftCount.textContent = `${cpLength(left.value)} 字符`;
    rightCount.textContent = `${cpLength(right.value)} 字符`;
  }

  function setStatus(_msg, _type = "") {}

  function setStats(_parts) {}

  function crc16(bytes) {
    let crc = 0xFFFF;
    for (const byte of bytes) {
      crc ^= byte << 8;
      for (let i = 0; i < 8; i++) {
        crc = (crc & 0x8000)
          ? ((crc << 1) ^ 0x1021) & 0xFFFF
          : (crc << 1) & 0xFFFF;
      }
    }
    return crc;
  }

  async function streamTransform(bytes, kind, format) {
    const Ctor = kind === "compress" ? CompressionStream : DecompressionStream;
    const stream = new Blob([bytes]).stream().pipeThrough(new Ctor(format));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function maybeCompress(raw) {
    if (!("CompressionStream" in window)) {
      return { payload: raw, flags: 0, compressed: false };
    }
    try {
      const gz = await streamTransform(raw, "compress", "gzip");
      // 只在真的更短时使用，避免短文本被 gzip 头部拖累。
      if (gz.length < raw.length) {
        return { payload: gz, flags: FLAG_GZIP, compressed: true };
      }
    } catch (_) {}
    return { payload: raw, flags: 0, compressed: false };
  }

  async function maybeDecompress(payload, flags) {
    if (!(flags & FLAG_GZIP)) return payload;
    if (!("DecompressionStream" in window)) {
      throw new Error("当前浏览器不支持 DecompressionStream，无法解压这段 V2 密文。");
    }
    return await streamTransform(payload, "decompress", "gzip");
  }

  function concatBytes(...arrays) {
    const total = arrays.reduce((n, a) => n + a.length, 0);
    const out = new Uint8Array(total);
    let offset = 0;
    for (const a of arrays) {
      out.set(a, offset);
      offset += a.length;
    }
    return out;
  }

  function bytesToBigInt(bytes) {
    // 前置 0x01 哨兵，确保 payload 中的前导 0 字节不会丢失。
    let n = 1n;
    for (const b of bytes) {
      n = (n << 8n) | BigInt(b);
    }
    return n;
  }

  function bigIntToBytes(n) {
    if (n <= 0n) throw new Error("密文数值无效。");
    const arr = [];
    while (n > 0n) {
      arr.push(Number(n & 0xFFn));
      n >>= 8n;
    }
    arr.reverse();
    if (arr[0] !== 0x01) {
      throw new Error("V2 哨兵校验失败，密文可能被修改。");
    }
    return new Uint8Array(arr.slice(1));
  }

  function allowedAt(index, state) {
    if (index === 0) return HEADS;
    return state === "boundary" ? AFTER_BOUNDARY : AFTER_HEAD;
  }

  function encodeConstrained(bytes) {
    let n = bytesToBigInt(bytes);
    let out = "";
    let state = "head";
    let index = 0;

    // 混合进制：首字符 radix 4；
    // 普通音后 radix 5；语气符号后 radix 7。
    while (n > 0n) {
      const allowed = allowedAt(index, state);
      const radix = BigInt(allowed.length);
      const digit = Number(n % radix);
      n /= radix;

      const ch = allowed[digit];
      out += ch;
      state = PUNCT.has(ch) ? "boundary" : "head";
      index++;
    }
    return out;
  }

  function decodeConstrained(cipher) {
    const chars = [...cipher].filter(ch => !/\s/u.test(ch));
    if (!chars.length) return new Uint8Array();

    let state = "head";
    const digits = [];
    const radices = [];

    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      if (!VALID.has(ch)) {
        throw new Error(`发现非法字符「${ch}」。V2 只允许 木、钼、嘿、𬭶、~、！、🤓 和空白。`);
      }

      const allowed = allowedAt(i, state);
      const digit = allowed.indexOf(ch);
      if (digit < 0) {
        if (ch === "木" || ch === "钼") {
          throw new Error(`第 ${i + 1} 个字符「${ch}」违反木音语法：木/钼只能出现在开头或语气符号之后。`);
        }
        throw new Error(`第 ${i + 1} 个字符不符合 V2 状态规则。`);
      }

      digits.push(digit);
      radices.push(allowed.length);
      state = PUNCT.has(ch) ? "boundary" : "head";
    }

    let n = 0n;
    for (let i = digits.length - 1; i >= 0; i--) {
      n = BigInt(digits[i]) + BigInt(radices[i]) * n;
    }
    return bigIntToBytes(n);
  }

  async function encryptText(text) {
    if (!text) {
      return { cipher: "", rawBytes: 0, storedBytes: 0, compressed: false };
    }

    const raw = new TextEncoder().encode(text);
    const packed = await maybeCompress(raw);
    const checksum = crc16(raw);

    const header = new Uint8Array([
      MAGIC_0, MAGIC_1, VERSION, packed.flags,
      (checksum >> 8) & 0xFF,
      checksum & 0xFF
    ]);

    const protocolBytes = concatBytes(header, packed.payload);
    const cipher = encodeConstrained(protocolBytes);

    return {
      cipher,
      rawBytes: raw.length,
      storedBytes: packed.payload.length,
      protocolBytes: protocolBytes.length,
      compressed: packed.compressed
    };
  }

  async function decryptText(cipher) {
    if (!cipher.trim()) {
      return { text: "", rawBytes: 0, storedBytes: 0, compressed: false };
    }

    const protocolBytes = decodeConstrained(cipher);
    if (protocolBytes.length < 6) {
      throw new Error("密文过短，不是有效的 V2 数据。");
    }

    if (
      protocolBytes[0] !== MAGIC_0 ||
      protocolBytes[1] !== MAGIC_1 ||
      protocolBytes[2] !== VERSION
    ) {
      throw new Error("协议头不匹配：这不是当前 V2 编码生成的密文。");
    }

    const flags = protocolBytes[3];
    const expectedCrc = (protocolBytes[4] << 8) | protocolBytes[5];
    const payload = protocolBytes.slice(6);
    const raw = await maybeDecompress(payload, flags);

    const actualCrc = crc16(raw);
    if (actualCrc !== expectedCrc) {
      throw new Error("CRC16 校验失败：密文可能有字符被增删或修改。");
    }

    const text = new TextDecoder("utf-8", { fatal: true }).decode(raw);
    return {
      text,
      rawBytes: raw.length,
      storedBytes: payload.length,
      compressed: !!(flags & FLAG_GZIP)
    };
  }

  document.getElementById("encryptBtn").addEventListener("click", async () => {
    try {
      const result = await encryptText(left.value);
      right.value = result.cipher;
      updateCounts();

      if (!left.value) {
        setStats([
          ["协议", "V2 状态约束编码"],
          ["有效字符", "木 钼 嘿 𬭶 ~ ！ 🤓"]
        ]);
        setStatus("请输入原文。");
        return;
      }

      const legacyBase4 = result.rawBytes * 4;
      const ratio = legacyBase4
        ? ((cpLength(result.cipher) / legacyBase4) * 100).toFixed(1) + "%"
        : "—";

      setStats([
        ["UTF-8", `${result.rawBytes} B`],
        [result.compressed ? "gzip 后" : "未压缩", `${result.storedBytes} B`],
        ["V2 密文", `${cpLength(result.cipher)} 字符`],
        ["相对旧 Base4 核心", ratio]
      ]);

      setStatus(
        result.compressed
          ? "加密完成。gzip 有收益，已自动启用；所有 ~、！、🤓 都是数据的一部分，没有随机噪声。"
          : "加密完成。该文本 gzip 没有变短，因此直接编码；所有字符都参与传递信息。",
        "ok"
      );
    } catch (err) {
      setStatus("加密失败：" + err.message, "err");
    }
  });

  document.getElementById("decryptBtn").addEventListener("click", async () => {
    try {
      const result = await decryptText(right.value);
      left.value = result.text;
      updateCounts();

      setStats([
        ["解码后 UTF-8", `${result.rawBytes} B`],
        [result.compressed ? "密文载荷（gzip）" : "密文载荷", `${result.storedBytes} B`],
        ["CRC16", "通过"],
        ["协议", "V2"]
      ]);

      setStatus("解密完成，木音语法、协议头与 CRC16 校验均通过。", "ok");
    } catch (err) {
      setStatus("解密失败：" + err.message, "err");
    }
  });

  document.getElementById("swapBtn").addEventListener("click", () => {
    [left.value, right.value] = [right.value, left.value];
    updateCounts();
    setStatus("已交换两栏。");
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    left.value = "";
    right.value = "";
    updateCounts();
    setStats([
      ["协议", "V2 状态约束编码"],
      ["有效字符", "木 钼 嘿 𬭶 ~ ！ 🤓"]
    ]);
    setStatus("已清空。");
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(right.value);
      setStatus("右侧密文已复制。", "ok");
    } catch (_) {
      right.select();
      document.execCommand("copy");
      setStatus("右侧密文已复制。", "ok");
    }
  });

  left.addEventListener("input", updateCounts);
  right.addEventListener("input", updateCounts);
  updateCounts();
})();
</script>
</body>
</html>
